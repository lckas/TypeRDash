name: Gerar IPA do TypeRDash

on:
  workflow_dispatch:

jobs:
  gerar-ipa:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extrair o projeto
        run: unzip -q TypeRDash-iPhone.zip

      - name: Compilar para iPhone
        run: |
          xcodebuild -project TypeRDash/TypeRDash.xcodeproj \
            -scheme TypeRDash \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO build

      - name: Empacotar o app
        run: |
          mkdir -p Payload
          ditto build-ios/Build/Products/Release-iphoneos/TypeRDash.app Payload/TypeRDash.app
          zip -qr TypeRDash.ipa Payload

      - name: Disponibilizar para download
        uses: actions/upload-artifact@v4
        with:
          name: TypeRDash-ipa
          path: TypeRDash.ipa
          if-no-files-found: error
